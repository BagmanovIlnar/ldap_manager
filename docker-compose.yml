# Прод: только веб-менеджер. Каталог (LDAP/AD) подключается снаружи через env.
# UI: http://localhost:8080 • swagger: http://localhost:8080/swagger-ui
#
# Для локальной разработки/e2e (тестовый OpenLDAP + приложение):
#   docker compose -f docker-compose.dev.yml up -d --build
services:
  app:
    build: .
    environment:
      LDAP_URL: ${LDAP_URL:?укажите LDAP_URL, напр. ldap://samba_addc:389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:?укажите LDAP_BASE_DN, напр. DC=home,DC=arpa}
      BIND_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
